name: Verify Hyttelan original viewer without an interstitial
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hyttelan-verify-sharing.yml'
permissions:
  contents: read
concurrency:
  group: hyttelan-live-build
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a pinned browser for a clean-session test
        run: |
          python -m pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify the original viewer and report social-preview limitations separately
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import hashlib,json,urllib.request,sys
          sys.path.insert(0,str(Path('hyttelan').resolve()))
          from share_preview import SHARE_URL,IMAGE_URL,IMAGE_NAME,DEADLINE
          expected='https://htmlpreview.github.io/?https://github.com/oleemil/oleemil.github.io/blob/main/hyttelan/index.html'
          assert SHARE_URL==expected
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta': self.meta[a.get('property',a.get('name',''))]=a.get('content','')
          def fetch(url,headers=None):
              req=urllib.request.Request(url,headers=headers or {'User-Agent':'Hyttelan-preview-check/2.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return response.read(),response.headers.get('Content-Type',''),response.geturl()
          result={'shareUrl':SHARE_URL,'attendanceWrites':0,'automaticMessengerPreviewVerified':False}
          try:
              for name in ('index.html','deltakere.html','live-client.js'):
                  assert 'raw.githack.com' not in (Path('hyttelan')/name).read_text(),name
              data,content_type,final_url=fetch(SHARE_URL,{'User-Agent':'facebookexternalhit/1.1'})
              parser=Metadata(); parser.feed(data.decode('utf-8'))
              assert 'text/html' in content_type
              result['initialHtmlContainsCabinOgImage']=parser.meta.get('og:image')==IMAGE_URL
              result['socialPreviewNote']='HTMLPreview renders the invitation in JavaScript. This test does not establish an automatic Messenger link preview.'
              image,image_type,_=fetch(IMAGE_URL)
              local=(Path('hyttelan/assets')/IMAGE_NAME).read_bytes()
              assert image_type.startswith('image/jpeg')
              assert hashlib.sha256(image).digest()==hashlib.sha256(local).digest()
              result['approvedCardAvailable']=True
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  context=browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
                  page=context.new_page()
                  errors=[]
                  page.on('pageerror',lambda error: errors.append(str(error)))
                  page.route('**/rest/v1/rpc/hyttelan_respond',lambda route: route.abort())
                  response=page.goto(SHARE_URL,wait_until='domcontentloaded',timeout=45000)
                  assert response.status==200
                  page.wait_for_function('window.HYTTELAN_CONFIG && document.querySelectorAll("#crew-grid .card").length===19',timeout=60000)
                  assert page.url==SHARE_URL,page.url
                  assert page.evaluate('window.HYTTELAN_CONFIG.shareUrl')==SHARE_URL
                  assert page.evaluate('window.HYTTELAN_CONFIG.bootstrap.deadline')==DEADLINE
                  page.wait_for_function('document.querySelector(".hero-art img")?.naturalWidth>0',timeout=30000)
                  assert '27. SEPTEMBER' in page.locator('#deadline-text').inner_text().upper()
                  page.screenshot(path='hyttelan-original-viewer-mobile.png')
                  result.update(browserOpenedInvitationDirectly=True,confirmationClicks=0,browserFinalUrl=page.url,guestCards=19,deadlineMs=DEADLINE,javascriptErrors=errors)
                  assert not errors,errors
                  browser.close()
              result['success']=True
          finally:
              Path('public-preview-check.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
              print(json.dumps(result,indent=2,ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyttelan-original-viewer-check
          path: |
            public-preview-check.json
            hyttelan-original-viewer-mobile.png
          retention-days: 7
